name: Build Windows EXE

on:
  workflow_dispatch:  # 手动触发
  push:
    branches:
      - main
      - master
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'templates/**'
      - '.github/workflows/build-windows-exe.yml'
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 安装PyInstaller
      run: |
        pip install pyinstaller
        
    - name: 创建必要的目录
      run: |
        if not exist uploads mkdir uploads
        if not exist output mkdir output
        
    - name: 打包为exe
      run: |
        pyinstaller --name="Excel数据汇总工具" ^
          --onefile ^
          --add-data="templates;templates" ^
          --hidden-import=flask ^
          --hidden-import=flask_cors ^
          --hidden-import=pandas ^
          --hidden-import=openpyxl ^
          --hidden-import=xlrd ^
          --collect-all=pandas ^
          --collect-all=openpyxl ^
          --clean ^
          app.py
          
    - name: 检查exe文件
      run: |
        if exist "dist\Excel数据汇总工具.exe" (
          echo "✅ exe文件生成成功"
          dir dist\Excel数据汇总工具.exe
        ) else (
          echo "❌ exe文件生成失败"
          exit 1
        )
        
    - name: 上传打包产物
      uses: actions/upload-artifact@v3
      with:
        name: Excel数据汇总工具-Windows
        path: dist/Excel数据汇总工具.exe
        retention-days: 30
