name: Build Windows EXE

on:
  push:
    branches:
      - cursor/excelmergertool-windows-exe-da3a
  pull_request:
    branches:
      - cursor/excelmergertool-windows-exe-da3a
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --name="Excel数据汇总工具" --onefile --windowed --add-data "templates;templates" --hidden-import=flask --hidden-import=pandas --hidden-import=openpyxl --hidden-import=xlrd --hidden-import=flask_cors --collect-all=openpyxl --collect-all=pandas app.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Excel数据汇总工具-Windows
        path: dist/Excel数据汇总工具.exe
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Excel数据汇总工具.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
